# Which concrete plugin backs each subsystem. Not a secret - safe to commit.
# Entries left null/empty aren't implemented yet; see PLAN.md for phase order.
# Moves to the dashboard Settings UI once it exists (Phase 4).

broker: mt5             # implemented; connect() needs the MT5 terminal installed + logged in
market_data: mt5        # implemented; same requirement
strategies:
  # Each runs side by side on the demo lab and is judged independently - none
  # waits for another. Testing 20 tweaks of a single idea and keeping the best
  # is how you select noise and lose real money.
  - ema_trend_v1          # MA-crossover trend-following (too few trades to judge yet)
  - london_breakout_v1    # scheduled volatility regime shift at the London open
  # DEMO-ONLY extension of london_breakout_v1 that moves exactly one thing
  # (pre-registered in docs/research-log.md, 2026-09-16). It loads on the live
  # engine too - plugins are global - but a new strategy is linked to a live
  # account with enabled=false, so guard 3 blocks it there.
  - london_breakout_wide_v1     # same 16 symbols, compression limit 1.75x instead of 1.5x
  #
  # RETIRED - no longer loaded, so neither engine fetches prices for them.
  # Each is still in engine/registry.py, so scripts/backtest.py can re-run it,
  # and strategies.retired=true blocks it even if re-listed here. Their trades
  # stay in the database; open positions are still managed and reconciled,
  # because neither depends on this list. Why each went: docs/research-log.md.
  #   donchian_breakout_v1       2026-08-30  demo CI entirely below zero
  #   donchian_trending_v1       2026-08-30  falsified 0-for-8 out of sample
  #   range_fade_v1              2026-09-16  demo CI entirely below zero (271 trades)
  #   range_fade_h4_v1           2026-09-16  backtest CI below zero, demo drawdown past 15R
  #   london_breakout_crosses_v1 2026-09-16  failed its pre-registered backtest screen
risk_engine: default
execution_engine: default
news_provider: forexfactory  # free ForexFactory weekly economic calendar (no
                             # key). Fails open if the feed is unreachable.
                             # 'placeholder' reverts to no blackout.
notifications:
  - console              # always safe - no external dependency
  - telegram              # verified working 2026-07-12
ai_provider: claude     # shadow mode only - see engine/loop.py, does not gate execution yet
